# tt1bet-auto.net — the Worker name is the deployment identity. Reusing
# another brand's name overwrites that brand's live Worker, so this must be
# unique per brand and must match the parked Worker if the domain was already
# parked with tools/domain-placeholder (confirm with
# `npx wrangler deployments list --name tt1bet` BEFORE the first deploy —
# this run stopped at build+verify and never deployed).
#
# "tt1bet", not "tt1bet-auto": verify-build derives the expected slug
# as host.split(/[-.]/)[0], so the hyphenated form fails the build.
name = "tt1bet"
account_id = "b420b898a9ab26387a074a0d0ba88b42"
compatibility_date = "2026-07-27"

# Worker ที่ทำ 301 www -> non-www ก่อนส่งต่อให้ไฟล์ static (ดู worker/index.js)
main = "worker/index.js"

workers_dev = false

[assets]
directory = "dist"
not_found_handling = "404-page"
# binding นี้คือสิ่งที่ทำให้ worker เรียก env.ASSETS.fetch() ส่งต่อไปหาไฟล์ได้
binding = "ASSETS"
