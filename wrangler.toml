# ruayruay888.app — the Worker name is the deployment identity. Reusing another
# brand's name overwrites that brand's live Worker, so this must be unique per
# brand and must match the parked Worker if the domain was already parked with
# tools/domain-placeholder (confirm with `npx wrangler deployments list` first).
name = "ruayruay888"
account_id = "e370e84fc51dfed2001ce18200a7f00a"
compatibility_date = "2026-07-27"

# Worker ที่ทำ 301 www -> non-www ก่อนส่งต่อให้ไฟล์ static (ดู worker/index.js)
main = "worker/index.js"

workers_dev = false

[assets]
directory = "dist"
not_found_handling = "404-page"
# binding นี้คือสิ่งที่ทำให้ worker เรียก env.ASSETS.fetch() ส่งต่อไปหาไฟล์ได้
binding = "ASSETS"
