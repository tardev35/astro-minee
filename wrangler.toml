# หวยพร้อมวีไอพี.com in punycode. A Worker name must be ASCII, and
# verify-build.mjs derives the expected value from the FULL first label of an
# IDN host (splitting on "-" would give every IDN brand the same slug "xn").
name = "xn--v3caicgve0awc1gc6qnc"
account_id = "d939ad68446c53a3e650fd35bbaf922a"
compatibility_date = "2026-07-27"

# Worker ที่ทำ 301 www -> non-www ก่อนส่งต่อให้ไฟล์ static (ดู worker/index.js)
main = "worker/index.js"

workers_dev = false

[assets]
directory = "dist"
not_found_handling = "404-page"
# binding นี้คือสิ่งที่ทำให้ worker เรียก env.ASSETS.fetch() ส่งต่อไปหาไฟล์ได้
binding = "ASSETS"
